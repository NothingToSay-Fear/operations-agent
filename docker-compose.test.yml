name: operations-agent-test
services:
  db-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-postgres-password
      TEST_APP_DB_PASSWORD: test-app-password
      TEST_COMMERCE_OWNER_PASSWORD: test-commerce-owner-password
      TEST_COMMERCE_READER_PASSWORD: test-commerce-reader-password
    volumes:
      - ./deploy/init-test-databases.sh:/docker-entrypoint-initdb.d/01-test-databases.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    build: ./backend
    command: [python, -m, pytest, -q]
    environment: &test_environment
      TEST_APP_DATABASE_URL: postgresql+asyncpg://test_operations_app:test-app-password@db-test:5432/operations_test
      TEST_COMMERCE_ADMIN_URL: postgresql+asyncpg://test_commerce_owner:test-commerce-owner-password@db-test:5432/commerce_test
      TEST_COMMERCE_DATABASE_URL: postgresql+asyncpg://test_commerce_reader:test-commerce-reader-password@db-test:5432/commerce_test
      RAG_EVALUATION_APP_DATABASE_URL: postgresql+asyncpg://test_operations_app:test-app-password@db-test:5432/operations_test
      RAG_EVALUATION_COMMERCE_ADMIN_URL: postgresql+asyncpg://test_commerce_owner:test-commerce-owner-password@db-test:5432/commerce_test
      RAG_EVALUATION_COMMERCE_DATABASE_URL: postgresql+asyncpg://test_commerce_reader:test-commerce-reader-password@db-test:5432/commerce_test
      AGENT_EVALUATION_APP_DATABASE_URL: postgresql+asyncpg://test_operations_app:test-app-password@db-test:5432/operations_test
      AGENT_EVALUATION_COMMERCE_ADMIN_URL: postgresql+asyncpg://test_commerce_owner:test-commerce-owner-password@db-test:5432/commerce_test
      AGENT_EVALUATION_COMMERCE_DATABASE_URL: postgresql+asyncpg://test_commerce_reader:test-commerce-reader-password@db-test:5432/commerce_test
      MEMORY_EVALUATION_APP_DATABASE_URL: postgresql+asyncpg://test_operations_app:test-app-password@db-test:5432/operations_test
      MEMORY_EVALUATION_COMMERCE_ADMIN_URL: postgresql+asyncpg://test_commerce_owner:test-commerce-owner-password@db-test:5432/commerce_test
      MEMORY_EVALUATION_COMMERCE_DATABASE_URL: postgresql+asyncpg://test_commerce_reader:test-commerce-reader-password@db-test:5432/commerce_test
      EMBEDDING_MODEL_PATH: /models/bge-small-zh-v1.5
      RERANKER_MODEL_PATH: /models/bge-reranker-base
    depends_on:
      db-test: {condition: service_healthy}

  rag-evaluation:
    build: ./backend
    command: [python, -m, app.rag_evaluation]
    environment: *test_environment
    volumes:
      - ./models:/models:ro
      - ./backend/evaluation:/app/evaluation
      - ./evaluation-reports:/app/evaluation-reports
    depends_on:
      db-test: {condition: service_healthy}

  agent-evaluation:
    build: ./backend
    command: [python, -m, app.evaluation]
    environment:
      <<: *test_environment
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-90}
    volumes:
      - ./models:/models:ro
      - ./evaluation-reports:/app/evaluation-reports
    depends_on:
      db-test: {condition: service_healthy}

  memory-evaluation:
    build: ./backend
    command: [python, -m, app.memory_evaluation]
    environment:
      <<: *test_environment
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-90}
    volumes:
      - ./models:/models:ro
      - ./backend/evaluation:/app/evaluation
      - ./evaluation-reports:/app/evaluation-reports
    depends_on:
      db-test: {condition: service_healthy}
